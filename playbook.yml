---
- name: Configure Web Server Environment
  hosts: all
  become: yes
  tasks:
    - name: Update apt package repository cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all system packages
      apt:
        name: "*"
        state: latest

    - name: Install Nginx web server
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx service is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Configure UFW to allow SSH traffic
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Configure UFW to allow HTTP traffic
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Enable UFW firewall
      ufw:
        state: enabled
